<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Походная визуализация</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>

<body>
  <main>
    <header>
      <div id="langControls">
        <button data-lang="ru">🇷🇺 RU</button>
        <button data-lang="en">🇬🇧 EN</button>
        <button data-lang="de">🇩🇪 DE</button>
        <button data-lang="es">🇪🇸 ES</button>
        <button data-lang="fr">🇫🇷 FR</button>
      </div>
      <!-- Кнопка переключения темной темы -->
      <button id="themeToggleBtn">🌙</button>
    </header>

    <div class="hero">
      <h1 data-i18n="mainTitle"></h1>
    </div>

    <div class="progress">
      <div class="info">
        <span data-i18n="totalProgress">Общий прогресс сборов</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="bar">
        <div id="progressBar"></div>
      </div>
    </div>

    <div id="successMessage" class="success-banner hidden">
      <h2 data-i18n="allPackedTitle"></h2>
      <p data-i18n="allPackedSub"></p>
    </div>

    <!-- АПТЕЧКА -->
    <div class="category">
      <header>
        <span>💊</span>
        <h2 data-i18n="catAptechka">АПТЕЧКА</h2>
        <span id="aptechkaCount"></span>
      </header>
      <div class="grid" id="aptechkaGrid"></div>
      <!-- Форма добавления предмета -->
    </div>

    <!-- БЫТОВЫЕ ПРИНАДЛЕЖНОСТИ -->
    <div class="category">
      <header>
        <span>🏠</span>
        <h2 data-i18n="catByt">БЫТОВЫЕ ПРИНАДЛЕЖНОСТИ</h2>
        <span id="bytCount"></span>
      </header>
      <div class="grid" id="bytGrid"></div>
    </div>

    <!-- ОДЕЖДА -->
    <div class="category">
      <header>
        <span>👕</span>
        <h2 data-i18n="catOdezhda">ОДЕЖДА</h2>
        <span id="odezhdaCount"></span>
      </header>
      <div class="grid" id="odezhdaGrid"></div>
    </div>

    <!-- ДОПОЛНИТЕЛЬНО -->
    <div class="category">
      <header>
        <span>?</span>
        <h2 data-i18n="catAdditionally">ДОПОЛНИТЕЛЬНО</h2>
        <span id="additionallyCount"></span>
      </header>
      <div class="grid" id="additionallyGrid"></div>
    </div>

    <div data-category="additionally">
      <div>
        <button class="trigger-btn">🎒</button>
        <div class="palette hidden">
          <span>🎒</span><span>🏕️</span><span>🔥</span><span>🍖</span><span>🎣</span>
          <span>🎸</span><span>🔦</span><span>🔋</span><span>🧭</span><span>🗺️</span>
          <span>👕</span><span>👟</span><span>🧢</span><span>🍏</span><span>🥤</span>
          <span>💊</span><span>🩹</span><span>🧴</span><span>🧸</span><span>📸</span>
        </div>
      </div>
      <input type="text" data-i18n-holder="addItemPlaceholder" placeholder="Добавить свой предмет...">
      <button class="add-btn" data-i18n="addItemBtn">➕</button>
    </div>

    <div class="packed">
      <button id="togglePackedBtn">
        <span id="togglePackedText" data-i18n="showPacked">Показать собранные вещи</span>
        (<span id="packedCount">0</span>)
      </button>
      <button id="resetBtn" data-i18n="resetBtn">Сбросить прогресс</button>
      <div id="packedContainer" class="grid hidden"></div>
    </div>

    <footer data-i18n="footer"></footer>
  </main>
  <canvas id="confettiCanvas"
    style="position:fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:9999;">
  </canvas>
</body>

</html>
